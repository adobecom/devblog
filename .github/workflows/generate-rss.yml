name: Generate RSS Feed and LLMS File

on:
  # Runs at :05 every hour — just after sort-query-index runs at :03
  schedule:
    - cron: '5 * * * *'
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  generate-feeds:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate RSS feed and LLMS file
        run: |
          npm run generate-rss
          npm run generate-llms

      - name: Commit and push rss.xml and llms.txt
        run: |
          git config user.name "GitHub Action (RSS feed and LLMS generator)"
          git config user.email "action@github.com"
          git add rss.xml llms.txt
          git diff --staged --quiet || git commit -m "Update RSS feed and llms.txt - $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          git push
