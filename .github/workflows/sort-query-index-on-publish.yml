name: Create a local sorted copy of the blog's query index (on publish)

on:
  repository_dispatch:
    types:
      - resource-published
  workflow_dispatch: # Allow manual trigger

jobs:
  sync-blog-data:
    # Only run for actual article publishes, not every resource in the repo.
    if: startsWith(github.event.client_payload.path, '/en/publish/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    # Avoid overlapping runs stepping on the same sorted-query-index.json /
    # new-articles detection when publishes fire in quick succession.
    concurrency:
      group: sort-query-index-on-publish
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run sorting scripts
        env:
          # Only set here (never in the cron workflow), so only on-publish
          # runs can ever produce a new-articles list / Slack notification.
          EMIT_NEW_ARTICLES: 'true'
        run: node sorted-index/sort-query-index.js

      - name: Commit and push changes if any
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action (sort query index)"
          git pull
          git add .
          git diff-index --quiet HEAD || git commit -am "Update sorted query index on publish- $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          git push

      # Runs after the index is committed and pushed, so a failure here
      # never leaves the index in an uncommitted state, and a retry of this
      # step alone can't cause a duplicate notification (the underlying
      # new-articles file is only produced once per run of the script above).
      - name: Notify Slack of new articles
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node sorted-index/notify-slack.js