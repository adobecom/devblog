name: Create a local sorted copy of the blog's query index (on publish)

on:
  repository_dispatch:
    types:
      - resource-published
  workflow_dispatch: # Allow manual trigger

jobs:
  sync-blog-data:
    # Only run for actual article publishes, not every resource in the repo.
    if: startsWith(github.event.client_payload.path, '/en/publish/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    # Avoid overlapping runs stepping on the same sorted-query-index.json /
    # new-articles detection when publishes fire in quick succession.
    concurrency:
      group: sort-query-index-on-publish
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run sorting scripts
        env:
          # Only set to 'true' for real publish events — never for manual
          # workflow_dispatch triggers — so manual runs cannot accidentally
          # produce a new-articles list or fire Slack notifications.
          EMIT_NEW_ARTICLES: ${{ github.event_name == 'repository_dispatch' && 'true' || 'false' }}
          PUBLISHED_PATH: ${{ github.event.client_payload.path }}
        run: node sorted-index/sort-query-index.js

      - name: Commit and push index changes if any
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action (sort query index)"
          git pull
          git add .
          git diff-index --quiet HEAD || git commit -am "Update sorted query index on publish- $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          git push

      # Runs after the index is committed and pushed, so a failure here
      # never leaves the index in an uncommitted state.
      # The notified-articles.json update (written by this script) is
      # committed in the next step so future runs can use it immediately.
      - name: Notify Slack of new articles
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node sorted-index/notify-slack.js

      # Commit the updated notified-articles.json so future runs (and queued
      # concurrent runs) know which articles have already been notified and
      # won't send duplicate Slack messages.
      - name: Commit updated notified-articles tracking file
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action (sort query index)"
          git pull
          git add sorted-index/notified-articles.json
          git diff-index --quiet HEAD -- sorted-index/notified-articles.json || git commit -m "Update Slack-notified articles tracking - $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          git push