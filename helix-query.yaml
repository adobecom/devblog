version: 1

indices:
  english: &default
    include:
      - /en/publish/**
    exclude:
      - '**/Document.*'
    target: /en/query-index.json
    properties:
      author:
        select: head > meta[name="author"]
        value: |
          attribute(el, 'content')
      title:
        select: main h1:first-of-type
        value: |
          textContent(el)
      metaTitle:
        select: head > meta[name="meta-title"]
        value: |
          attribute(el, 'content')
      date:
        select: head > meta[name="publication-date"]
        value: |
          dateValue(attribute(el, 'content'), 'MM-DD-YYYY')

      # 🔽 Added for accurate metadata-based sorting (safe addition)
      sortDateTimestamp:
        select: head > meta[name="m_date"]
        value: |
          parseTimestamp(attribute(el, 'content'), 'YYYY-MM-DD')
      sortDate:
        select: head > meta[name="publication-date"], head > meta[name="m_date"]
        value: |
          attribute(el, 'content')
      updatedDate:
        select: head > meta[name="updated_date"]
        value: |
          attribute(el, 'content')
      # 🔼 End of addition

      adobeCloud:
        select: head > meta[name="adobe-cloud"]
        value: |
          attribute(el, 'content')
      adobeApp:
        select: head > meta[name="adobe-app"]
        value: |
          attribute(el, 'content')
          
      image:
        select: head > meta[property="og:image"]
        value: |
          match(attribute(el, 'content'), 'https:\/\/[^/]+(\/.*)')
      imageAlt:
        select: head > meta[property="og:image:alt"]
        value: |
          attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: |
          attribute(el, 'content')
      shortDescription:
        select: head > meta[name="short_description"]
        value: |
          attribute(el, 'content')
      tags:
        select: head > meta[property="article:tag"]
        values: |
          attribute(el, 'content')
      newsletterPlanned:
        select: head > meta[name="newsletter_planned"]
        value: |
          attribute(el, 'content')
      newsletterPublished:
        select: head > meta[name="newsletter_published"]
        value: |
          attribute(el, 'content')
      importer:
        select: head > meta[name="m_importer"]
        value: |
          attribute(el, 'content')
      robots:
        select: head > meta[name="robots"]
        value: |
          attribute(el, 'content')
      lastModified:
        select: none
        value: |
          parseTimestamp(headers['last-modified'], 'ddd, DD MMM YYYY hh:mm:ss GMT')
      mediaUrl:
        select: head > meta[name="mediaurl"]
        value: |
          attribute(el, 'content')

  article-management:
    include:
      - /en/publish/**
    exclude:
      - '**/Document.*'
    target: /en/article-management.xlsx

    properties:
      image:
        select: head > meta[property="og:image"]
        value: |
          match(attribute(el, 'content'), 'https:\/\/[^/]+(\/.*)')

      title:
        select: head > meta[name="og:title"]
        value: |
          attribute(el, 'content')

      description:
        select: head > meta[name="description"]
        value: |
          attribute(el, 'content')

      author:
        select: head > meta[name="author"]
        value: |
          attribute(el, 'content')

      url:
        select: head > meta[property="og:url"]
        value: |
          attribute(el, 'content')

      publicationDate:
        select: head > meta[name="m_date"]
        value: |
          attribute(el, 'content')

      draft:
        select: none
        value: |
          match(path, '\/(drafts)\/')

      updatedDate:
        select: head > meta[name="updated_date"]
        value: |
          attribute(el, 'content')

      updateNote:
        select: head > meta[name="update_note"]
        value: |
          attribute(el, 'content')

      adobeCloud:
        select: head > meta[name="adobe-cloud"]
        value: |
          attribute(el, 'content')

      adobeApp:
        select: head > meta[name="adobe-app"]
        value: |
          attribute(el, 'content')

      tags:
        select: head > meta[property="article:tag"]
        values: |
          attribute(el, 'content')

      newsletterPlanned:
        select: head > meta[name="newsletter_planned"]
        value: |
          attribute(el, 'content')

      newsletterPublished:
        select: head > meta[name="newsletter_published"]
        value: |
          attribute(el, 'content')

      newsletterHeroStory:
        select: head > meta[name="newsletter_hero-story"]
        value: |
          attribute(el, 'content')

      newsletterCaption:
        select: head > meta[name="newsletter_caption"]
        value: |
          attribute(el, 'content')

      linkedinCaption:
        select: head > meta[name="linkedin_caption"]
        value: |
          attribute(el, 'content')

      xCaption:
        select: head > meta[name="x_caption"]
        value: |
          attribute(el, 'content')

      expressDiscordCaption:
        select: head > meta[name="express-discord_caption"]
        value: |
          attribute(el, 'content')

      uxpForumsCaption:
        select: head > meta[name="uxp-forums_caption"]
        value: |
          attribute(el, 'content')

      devSlackCaption:
        select: head > meta[name="devslack_caption"]
        value: |
          attribute(el, 'content')
